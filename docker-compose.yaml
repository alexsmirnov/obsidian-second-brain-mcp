# Obscura CDP browser + MCP server fleet.
#
# The two services share one network namespace: Obscura binds CDP on
# 127.0.0.1:9222 and the MCP container reaches it over loopback, so CDP is
# never exposed outside the host. The MCP port is published on the browser
# service because of `network_mode: service:browser`.
name: vault-mcp
services:
  browser:
    image: h4ckf0r0day/obscura:0.2.7
    command: ["serve", "--stealth", "--allow-private-network","--quiet"]
    environment:
      - RUST_MIN_STACK=16777216
      # Obscura time budgets in milliseconds: stalled tabs fail fast instead of
      # holding V8 isolates open.
      - OBSCURA_NAV_TIMEOUT_MS=${OBSCURA_NAV_TIMEOUT_MS:-15000}
      - OBSCURA_SCRIPT_DEADLINE_MS=${OBSCURA_SCRIPT_DEADLINE_MS:-8000}
      - OBSCURA_MODULE_BUDGET_MS=${OBSCURA_MODULE_BUDGET_MS:-1500}
      - OBSCURA_CDP_COMMAND_TIMEOUT_MS=${OBSCURA_CDP_COMMAND_TIMEOUT_MS:-20000}
    # Hard memory ceiling without swap: a leaking browser is OOM-killed and
    # restarted clean by the restart policy. /dev/shm counts toward the ceiling.
    mem_limit: ${BROWSER_MEMORY_LIMIT:-1g}
    memswap_limit: ${BROWSER_MEMORY_LIMIT:-1g}
    shm_size: ${BROWSER_SHM_SIZE:-256m}
    ports:
      # - "127.0.0.1:9222:9222"
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/obscura", "fetch", "http://localhost:9222/json/version", "--allow-private-network", "--dump", "original"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  server:
    build: .
    network_mode: "service:browser"
    depends_on:
      browser:
        condition: service_healthy
        # Restarts this service when compose restarts the browser. A restart by
        # the Docker daemon (for example after an OOM kill) leaves this service
        # in a stale network namespace: run `docker compose restart server`.
        restart: true
    env_file:
      - path: .env
        required: true
    environment:
      BROWSER_CDP_URL: "ws://127.0.0.1:9222/devtools/browser"
    volumes:
      - "${HOST_VAULT}:/vault"
    healthcheck:
      # Native Python 3.13 script that checks the HTTP server status
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
